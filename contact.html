<body>
    <header>
        <h1>Contact Information</h1>
    </header>
    <p id="ContactInfo">
        <h4>
            School Email: kariveraapolinar@my.waketech.edu
        </h4>
        <h4>
            Personal Email: karimalberto08@gmail.com
        </h4>    
    </p>
    <div class="container">
        <form class="contact-form" action="/submit" method="post">
          <!-- Name Field -->
          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">
          </div>
      
          <!-- Email Field -->
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
          </div>
      
          <!-- Phone Field -->
          <div class="form-group">
            <label for="phone">Phone (XXX-XXX-XXXX):</label>
            <input type="tel" id="phone" name="phone" pattern="\d{3}[\-]\d{3}[\-]\d{4}" placeholder="123-456-7890">
          </div>
      
          <!-- Message Field -->
          <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" required minlength="10" placeholder="Enter your message"></textarea>
          </div>
      
          <!-- Radio Buttons -->
          <div class="form-group">
            <label>What is your inquiry about?</label>
            <div class="radio-group">
              <label>
                <input type="radio" name="inquiry" value="question" required> Question
              </label>
              <label>
                <input type="radio" name="inquiry" value="comment" required> Comment
              </label>
              <label>
                <input type="radio" name="inquiry" value="suggestion" required> Suggestion
              </label>
            </div>
          </div>
      
          <!-- Submit Button -->
          <div class="form-group">
            <button type="submit">Submit</button>
          </div>
        </form>
      </div>
      
</body>
</html>
